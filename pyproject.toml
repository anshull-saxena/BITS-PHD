[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppipe"
version = "0.1.0"
description = "DeepPIPE NIFTY 50 reproduction and adaptive calibration controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raunak Goyal" }]
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyyaml",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
deeppipe = "deeppipe.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deeppipe = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full reproduction runs (40+ minutes)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
