data_path: data/market_data.csv
out_dir: outputs
seed: 42
data:
  target: NIFTY_Close
  train_split: 0.7
  val_split: 0.15
  feature_set: core14
train:
  seq_len: 60
  hidden: 64
  layers: 2
  dropout: 0.2
  batch: 32
  lr: 0.0005
  warmup_ep: 40
  full_ep: 120
  beta: 0.5
  conf: 0.9
  lam: 15.0
  device: auto
ctrl:
  actions:
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  rv_short: 5
  rv_long: 20
  resid_win: 20
  tiers:
  - greedy
  - linucb
  - lints
  - mlp
  seed: 42
write_figures: true
write_zip: true
checkpoint_path: null
